      <stop offset="0%" stop-color="#f7931a"/>
      <stop offset="50%" stop-color="#e6b800"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d14"/>
