  <!-- Text -->
  <text x="54" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#ffffff" letter-spacing="0.1em">YOUR LOGO</text>
  <text x="54" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="8.5" fill="#ffffff" opacity="0.3" letter-spacing="0.18em">CRYPTO CASINO</text>
